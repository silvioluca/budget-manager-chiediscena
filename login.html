<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accesso — Scuola di Danza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #141416;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.14);
    --text: #f0ede8;
    --text-muted: #666;
    --accent: #c9a96e;
    --accent-dim: rgba(201,169,110,0.12);
    --red: #e05555;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  /* Subtle background pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle at 20% 80%, rgba(201,169,110,0.04) 0%, transparent 50%),
                      radial-gradient(circle at 80% 20%, rgba(201,169,110,0.03) 0%, transparent 50%);
    pointer-events: none;
  }
  .login-wrap {
    width: 360px;
    max-width: 90vw;
    animation: fadeUp 0.6s cubic-bezier(0.4,0,0.2,1) both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .login-logo {
    text-align: center;
    margin-bottom: 40px;
  }
  .login-logo img {
    width: 100px;
    height: auto;
    opacity: 0.92;
  }
  .login-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    text-align: center;
    margin-top: 14px;
  }
  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .form-label {
    display: block;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .form-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--border-hover); }
  .form-input::placeholder { color: #333; }
  .btn-login {
    width: 100%;
    padding: 13px;
    background: var(--accent-dim);
    border: 1px solid rgba(201,169,110,0.25);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--accent);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-login:hover {
    background: rgba(201,169,110,0.2);
    border-color: rgba(201,169,110,0.4);
  }
  .login-error {
    font-size: 12px;
    color: var(--red);
    text-align: center;
    min-height: 16px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .login-error.show { opacity: 1; }
  .divider {
    height: 1px;
    background: var(--border);
  }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <img src="Logo_6.png" alt="Logo Scuola di Danza">
    <div class="login-title">Area riservata</div>
  </div>
  <div class="login-box">
    <div>
      <label class="form-label" for="email">Email</label>
      <input class="form-input" type="email" id="email" placeholder="email@esempio.it" autocomplete="username">
    </div>
    <div>
      <label class="form-label" for="pwd">Password</label>
      <input class="form-input" type="password" id="pwd" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="divider"></div>
    <button class="btn-login" id="btnLogin">Accedi</button>
    <button class="btn-login" id="btnGoogle" style="display:flex;align-items:center;justify-content:center;gap:10px;">
      <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C41 35.4 44 30.2 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Accedi con Google
    </button>
    <div class="login-error" id="errMsg">Credenziali errate. Riprova.</div>
  </div>
</div>
<script type="module">
  import { auth, signInWithEmailAndPassword, signInWithGoogle, signOut, checkAccess } from './db.js';
  import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

  const showErr = (msg) => {
    const el = document.getElementById('errMsg');
    el.textContent = msg;
    el.classList.add('show');
  };

  // Già loggato → vai all'app
  const unsub = onAuthStateChanged(auth, user => {
    unsub();
    if (user) {
      sessionStorage.setItem('danza_auth', '1');
      window.location.replace('app.html');
    }
  });

  // Dopo il login verifica la whitelist (regole Firestore):
  // se l'account non è autorizzato, esci subito.
  async function enterApp() {
    if (!(await checkAccess())) {
      await signOut(auth);
      showErr('Account non autorizzato.');
      return;
    }
    sessionStorage.setItem('danza_auth', '1');
    window.location.replace('app.html');
  }

  async function tryLogin() {
    const email = document.getElementById('email').value.trim();
    const pwd   = document.getElementById('pwd').value;
    if (!email || !pwd) return;
    try {
      await signInWithEmailAndPassword(auth, email, pwd);
      await enterApp();
    } catch (e) {
      showErr('Credenziali errate. Riprova.');
      document.getElementById('pwd').value = '';
      document.getElementById('pwd').focus();
    }
  }

  async function tryGoogle() {
    try {
      await signInWithGoogle();
      await enterApp();
    } catch (e) {
      if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') {
        showErr('Accesso Google non riuscito.');
      }
    }
  }

  document.getElementById('btnLogin').addEventListener('click', tryLogin);
  document.getElementById('btnGoogle').addEventListener('click', tryGoogle);
  document.getElementById('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
  document.getElementById('pwd').addEventListener('input', () => document.getElementById('errMsg').classList.remove('show'));
  document.getElementById('email').addEventListener('input', () => document.getElementById('errMsg').classList.remove('show'));
</script>
</body>
</html>
